services:
  redis:
    image: redis:7-alpine
    container_name: numm-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - numm_redis_data:/data

  postgres:
    image: postgres:16
    container_name: numm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-material_master}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - numm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-material_master}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: numm-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/material_master}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be configured in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      AI_SERVICE_URL: http://ai-service:8001
      AI_BATCH_TIMEOUT_SECONDS: "600"
      AUTO_APPROVE_EXACT_MATCHES: "false"
      AUTO_APPROVE_MIN_SCORE: "0.95"
      MOCK_SAP_URL: http://mock-sap:8002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
      IMPORT_QUEUE_MODE: celery
      UPLOAD_DIR: /shared-uploads
      MAX_IMPORT_FILE_BYTES: "26214400"
      MAX_IMPORT_ROWS: "100000"
      IMPORT_CHUNK_SIZE: "1000"
      IMPORT_CLASSIFICATION_WORKERS: "4"
      IMPORT_MAX_RETRIES: "3"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - numm_uploads:/shared-uploads
      - ./CPSE_Material_Image_Search:/reference-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
      mock-sap:
        condition: service_started
      redis:
        condition: service_started

  import-worker:
    build:
      context: ./backend
    container_name: numm-import-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/material_master}
      REDIS_URL: redis://redis:6379/0
      IMPORT_QUEUE_MODE: celery
      UPLOAD_DIR: /shared-uploads
      MAX_IMPORT_FILE_BYTES: "26214400"
      MAX_IMPORT_ROWS: "100000"
      IMPORT_CHUNK_SIZE: "1000"
      IMPORT_CLASSIFICATION_WORKERS: "4"
      IMPORT_MAX_RETRIES: "3"
      AI_SERVICE_URL: http://ai-service:8001
      AI_BATCH_TIMEOUT_SECONDS: "600"
      AUTO_APPROVE_EXACT_MATCHES: "false"
      AUTO_APPROVE_MIN_SCORE: "0.95"
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - numm_uploads:/shared-uploads
      - ./CPSE_Material_Image_Search:/reference-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    container_name: numm-ai
    environment:
      MATCHER_VERSION: "1.0.0"
      MODEL_NAME: "all-MiniLM-L6-v2"
      MODEL_PATH: "/models/all-MiniLM-L6-v2"
      MODEL_VERSION: "c9745ed1d9f207416be6d2e6f8de32d1f16199bf"
      TEAMMATE_AI_SRC: "/teammate-ai/src"
      AI_ENGINE_REQUIRED: "true"
      ALLOW_FALLBACK: "false"
      # The verified model revision is baked into the image; runtime downloads
      # and fallback matching are deliberately disabled.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      FAISS_INDEX_PATH: "/ai-data/materials.hnsw"
      VISUAL_INDEX_DIR: "/ai-data"
      VISUAL_MODEL_PATH: "/models/clip-ViT-B-32"
    volumes:
      - numm_ai_data:/ai-data
    ports:
      - "${AI_PORT:-8001}:8001"

  mock-sap:
    build:
      context: ./mock-sap
    container_name: numm-mock-sap
    ports:
      - "${MOCK_SAP_PORT:-8002}:8002"

  frontend:
    build:
      context: ./frontend
    container_name: numm-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  numm_postgres_data:
  numm_redis_data:
  numm_uploads:
  numm_ai_data:
