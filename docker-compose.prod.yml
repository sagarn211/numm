services:
  postgres:
    ports: []
    restart: unless-stopped
  redis:
    ports: []
    restart: unless-stopped
  backend:
    ports: []
    restart: unless-stopped
    environment:
      FRONTEND_URL: ${FRONTEND_URL:?Set the public HTTPS frontend URL}
  import-worker:
    restart: unless-stopped
  ai-service:
    ports: []
    restart: unless-stopped
  mock-sap:
    ports: []
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
