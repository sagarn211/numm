name: Remediation quality gates

on:
  push:
  pull_request:

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.lock
      - working-directory: backend
        run: python -m unittest tests.test_remediation_services tests.test_remediation_flow -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  real-ai-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ai-service/Dockerfile -t numm-ai:test .
      - run: docker run --rm numm-ai:test python -m unittest discover -s tests -v
      - run: mkdir -p artifacts
      - run: docker run --rm -v "${{ github.workspace }}/artifacts:/artifacts" numm-ai:test python /teammate-ai/tests/eval_against_ground_truth.py --output /artifacts/evaluation-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-report
          path: artifacts/evaluation-report.json
          if-no-files-found: error

  docker-end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: sed -i 's/^SECRET_KEY=$/SECRET_KEY=ci-e2e-secret-key-at-least-32-characters/' .env
      - run: docker compose up -d --build postgres redis mock-sap ai-service backend import-worker
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - run: docker compose exec -T backend python -m app.config.seed_db
      - run: docker compose exec -T backend python -m unittest tests.test_e2e_integration -v
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
